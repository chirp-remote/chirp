version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
  settings:
    errorlint:
      # client wraps ErrUnavailable while formatting the underlying transport
      # error with %v so callers test ErrUnavailable rather than net/http internals.
      errorf-multi: false
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests build local httptest servers, raw sockets and fixtures where
      # background contexts and direct type assertions are idiomatic.
      - path: _test\.go
        linters:
          - bodyclose
          - forcetypeassert
          - noctx
      # status/store.go operates on a single-connection local SQLite file with
      # busy_timeout(5000); Store's synchronous methods take no context.
      - path: ^status/store\.go$
        linters:
          - noctx
